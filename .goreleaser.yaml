version: 2

project_name: cli-reader

builds:
  - id: cli-reader
    main: .
    binary: cli-reader
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X cli-reader/internal/buildinfo.Version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - AUTHORS
      - testdata/demo.epub

checksum:
  name_template: checksums.txt

release:
  footer: |
    ---
    **作者**：Mark24Code · <mark.zhangyoung@gmail.com>
    **主页**：https://github.com/Mark24Code/cli-reader

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
